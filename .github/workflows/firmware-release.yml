name: Firmware Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'dependencies.lock') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
          pio --version

      - name: Generate version header
        run: |
          mkdir -p include
          printf '#define FIRMWARE_VERSION "%s"\n' "${{ steps.version.outputs.version }}" > include/version.h
          cat include/version.h

      - name: Build firmware
        run: pio run -e esp32-c3-devkitm-1

      - name: Validate partition table, flash size and image size
        run: |
          python tools/validate_partitions.py \
            --firmware .pio/build/esp32-c3-devkitm-1/firmware.bin

      - name: Calculate SHA-256
        id: sha
        run: |
          sha256sum .pio/build/esp32-c3-devkitm-1/firmware.bin \
            | awk '{print $1}' > firmware.sha256
          echo "sha256=$(cat firmware.sha256)" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $(cat firmware.sha256)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## Firmware Release ${{ steps.version.outputs.version }}

            ESP32-C3 MQTT LED controller firmware built from `${{ github.ref_name }}`.

            ### Assets

            | File | Description |
            | --- | --- |
            | `firmware.bin` | Application image (OTA update payload) |
            | `partitions.bin` | Partition table (flash at `0x8000`) |
            | `firmware.sha256` | SHA-256 checksum of `firmware.bin` |

            **SHA-256:** `${{ steps.sha.outputs.sha256 }}`

            ### OTA update

            Devices subscribed to `devices/ota` download `firmware.bin` and verify it
            against the SHA-256 checksum above before flashing.

            ### Full flash

            ```bash
            pio run -t upload   # from a local checkout of this tag
            ```
          files: |
            .pio/build/esp32-c3-devkitm-1/firmware.bin
            .pio/build/esp32-c3-devkitm-1/partitions.bin
            firmware.sha256
