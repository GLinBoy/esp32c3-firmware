name: Firmware CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'dependencies.lock') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
          pio --version

      - name: Generate development version header
        run: |
          mkdir -p include
          SHORT_SHA="$(git rev-parse --short HEAD)"
          printf '#define FIRMWARE_VERSION "dev-%s"\n' "$SHORT_SHA" > include/version.h
          cat include/version.h

      - name: Build firmware
        run: pio run -e esp32-c3-devkitm-1

      - name: Validate partition table, flash size and image size
        run: |
          python tools/validate_partitions.py \
            --firmware .pio/build/esp32-c3-devkitm-1/firmware.bin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build
          if-no-files-found: error
          path: |
            .pio/build/esp32-c3-devkitm-1/firmware.bin
            .pio/build/esp32-c3-devkitm-1/partitions.bin
